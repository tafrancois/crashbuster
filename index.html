<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8546B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crash Buster">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Crash Buster</title>
<style>
:root{
  --bg:#FFF7F0; --card:#FFFFFF; --ink:#33203A; --muted:#8A7683; --line:#F0E2DA;
  --berry:#E8546B; --berry-soft:#FDE3E7; --mint:#2FA67D; --mint-soft:#DDF5EC;
  --honey:#D98E1F; --honey-soft:#FCEFD9; --plum:#6B3F7A; --plum-soft:#EFE4F3;
  --shadow:0 2px 12px rgba(80,40,60,.08); --r:18px;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B1420; --card:#261C2C; --ink:#F6EAF0; --muted:#B39FB0; --line:#3A2C40;
    --berry:#FF6F86; --berry-soft:#45222D; --mint:#4FD1A0; --mint-soft:#1E3A30;
    --honey:#F5B95A; --honey-soft:#43341C; --plum:#C79BE0; --plum-soft:#35263F;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
h1,h2,h3,.rounded{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:16px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--berry)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 18px 8px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{margin:0;font-size:24px;letter-spacing:-.01em}
.topbar h1 span{color:var(--berry)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--card);box-shadow:var(--shadow)}

main{padding:4px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto}
.tab{display:none}.tab.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.bottomnav button .em{font-size:22px;filter:grayscale(.6);opacity:.7;transition:.15s}
.bottomnav button.active{color:var(--berry)}
.bottomnav button.active .em{filter:none;opacity:1;transform:scale(1.12)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:15px}

/* today */
.daynav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.daynav button.arrow{width:38px;height:38px;border-radius:50%;font-size:22px;background:var(--card);box-shadow:var(--shadow)}
.daynav button.arrow:disabled{opacity:.3}
.daynav .daylabel{font-weight:700;font-size:16px;text-align:center}
.daynav .daylabel small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ring-card{display:flex;flex-direction:column;align-items:center;padding:18px 16px 14px}
.ring{position:relative;width:190px;height:190px}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-size:46px;font-weight:800;line-height:1;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.ring .num small{font-size:20px;font-weight:700}
.ring .of{color:var(--muted);font-size:13px;margin-top:4px}
.status{margin-top:10px;font-weight:600;text-align:center}
.natural-line{margin-top:6px;font-size:13px;color:var(--muted)}
.natural-line b{color:var(--mint)}
.flag{margin-top:10px;background:var(--honey-soft);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;text-align:center;line-height:1.35}
.unknown{font-size:12px;color:var(--honey);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--plum-soft);color:var(--plum);margin-top:12px}
.pill.on{background:var(--plum);color:#fff}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.big3 button{border-radius:var(--r);padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-weight:700;font-size:14px;box-shadow:var(--shadow);transition:transform .1s}
.big3 button:active{transform:scale(.95)}
.big3 .em{font-size:30px}
.b-food{background:var(--honey-soft);color:var(--honey)}
.b-crave{background:var(--berry-soft);color:var(--berry)}
.b-win{background:var(--mint-soft);color:var(--mint)}
.banner{display:flex;gap:10px;align-items:center;background:var(--plum-soft);color:var(--plum);border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600;font-size:14px;width:100%;text-align:left}

/* timeline items */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:left;width:100%}
.item .badge{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg)}
.item.food .badge{background:var(--honey-soft)}
.item.craving .badge{background:var(--berry-soft)}
.item.win .badge{background:var(--mint-soft)}
.item.journal .badge{background:var(--plum-soft)}
.item .body{flex:1;min-width:0}
.item .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.item .txt{font-size:15px;line-height:1.4;word-wrap:break-word}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.item .grams{font-weight:800;font-size:20px;color:var(--honey);white-space:nowrap;font-family:ui-rounded,system-ui,sans-serif}
.item .grams small{font-size:12px}
.item .grams{text-align:right}
.item .grams .nat{font-size:11px;font-weight:600;color:var(--mint);font-family:-apple-system,system-ui,sans-serif}
.item .pts{font-weight:800;color:var(--mint);white-space:nowrap}
.item .thumb{width:52px;height:52px;object-fit:cover;border-radius:10px}
.item.slip{outline:1.5px dashed var(--berry)}
.outcomes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.outcomes button{font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line)}
.outcomes .o-res{color:var(--mint);border-color:var(--mint)}
.outcomes .o-sm{color:var(--honey);border-color:var(--honey)}
.outcomes .o-gi{color:var(--berry);border-color:var(--berry)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:6px;margin-right:4px}
.t-res{background:var(--mint-soft);color:var(--mint)}
.t-sm{background:var(--honey-soft);color:var(--honey)}
.t-gi{background:var(--berry-soft);color:var(--berry)}
.t-move{background:var(--plum-soft);color:var(--plum)}
.j-title{font-weight:700;font-size:16px;margin-bottom:4px}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.small-actions{display:flex;gap:14px;margin-top:8px}
.small-actions button{font-size:13px;font-weight:700;color:var(--plum)}
.dayhead{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 2px}

/* chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:12px -2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
.seg button{padding:10px 4px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--berry);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:15px}
.primary{background:var(--berry);color:#fff}
.ghost{background:var(--bg);border:1.5px solid var(--line)}
.danger{color:var(--berry)}
.wide{width:100%}
.link{color:var(--plum);font-weight:700;font-size:14px;padding:6px 0}

/* toolkit */
.why-card{background:linear-gradient(135deg,var(--berry-soft),var(--plum-soft));border-radius:var(--r);padding:18px;position:relative;text-align:left;width:100%}
.why-card .why-label{font-size:12px;font-weight:800;color:var(--berry);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.why-card .why-text{font-size:17px;line-height:1.45;font-weight:600;white-space:pre-wrap}
.why-card .why-src{font-size:12px;color:var(--muted);margin-top:8px}
.move-card .head{display:flex;align-items:center;gap:10px}
.move-card .em{font-size:28px}
.move-card .name{font-weight:800;font-size:17px}
.move-card .stats{font-size:12px;color:var(--muted)}
.move-card .notes{margin-top:8px;font-size:14px;white-space:pre-wrap;line-height:1.4}
.goal-card .txt{font-size:15px;line-height:1.45;white-space:pre-wrap}
.goal-card .meta{font-size:12px;color:var(--muted);margin-top:8px}
.goal-card.due{outline:2px solid var(--plum)}
.goal-card.done{opacity:.65}

/* wins */
.score{text-align:center;padding:22px 16px}
.score .big{font-size:64px;font-weight:900;line-height:1;color:var(--mint);font-family:ui-rounded,system-ui,sans-serif}
.score .lbl{font-weight:700;color:var(--muted);margin-top:4px}
.score .vibe{font-size:18px;font-weight:800;margin-top:10px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stats3 .card{text-align:center;padding:12px 6px}
.stats3 b{display:block;font-size:22px;font-family:ui-rounded,system-ui,sans-serif}
.stats3 span{font-size:12px;color:var(--muted);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin-top:8px}
.bars .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted);font-weight:700}
.bars .fill{width:100%;border-radius:8px 8px 4px 4px;background:var(--mint);min-height:4px}
.bars .bar.today .fill{background:var(--berry)}
.bars .v{color:var(--ink)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(30,15,30,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease;-webkit-overflow-scrolling:touch}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.actions{display:flex;gap:10px;margin-top:20px;align-items:center}
.actions .primary{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.photo-box{border:2px dashed var(--line);border-radius:16px;min-height:120px;display:grid;place-items:center;color:var(--muted);font-weight:700;overflow:hidden;width:100%}
.photo-box img{width:100%;max-height:260px;object-fit:cover;display:block}
.ai{width:100%;margin-top:10px;padding:13px;border-radius:14px;font-weight:800;background:linear-gradient(90deg,var(--plum),var(--berry));color:#fff}
.ai:disabled{opacity:.6}
.ai-out{margin-top:10px;background:var(--plum-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.ai-out.err{background:var(--berry-soft)}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px;font-weight:600;margin-top:16px}
.check input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--berry);margin-top:1px}
.check small{display:block;color:var(--muted);font-weight:500}
.pickrow{display:flex;flex-wrap:wrap;gap:8px}
.pickrow button{padding:9px 13px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.pickrow button.on{background:var(--berry);border-color:var(--berry);color:#fff}
.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.move-pick{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.move-pick .em{font-size:26px}
.move-pick small{color:var(--muted);font-size:12px;line-height:1.3}
.move-pick:active{transform:scale(.96)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="topbar">
  <h1>Crash <span>Buster</span> 💥</h1>
  <button class="icon-btn" data-action="openSettings" aria-label="Settings">⚙️</button>
</header>

<main>
  <section id="tab-today" class="tab active"></section>
  <section id="tab-journal" class="tab"></section>
  <section id="tab-toolkit" class="tab"></section>
  <section id="tab-wins" class="tab"></section>
</main>

<nav class="bottomnav">
  <button data-action="tab" data-tab="today" class="active"><span class="em">🏠</span>Today</button>
  <button data-action="tab" data-tab="journal"><span class="em">📖</span>Journal</button>
  <button data-action="tab" data-tab="toolkit"><span class="em">🧰</span>Toolkit</button>
  <button data-action="tab" data-tab="wins"><span class="em">🏆</span>Wins</button>
</nav>

<div id="sheetWrap" class="sheet-wrap hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const keyToDate = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d.getTime()); };
const todayKey = () => dayKey(Date.now());
const weekStartKey = (k) => { const d = keyToDate(k); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return dayKey(d.getTime()); };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDay = (k) => keyToDate(k).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
const fmtShort = (k) => keyToDate(k).toLocaleDateString([], { month: 'short', day: 'numeric' });
const fmtDateTime = (ts) => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const toLocalInput = (ts) => { const d = new Date(ts); return `${dayKey(ts)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fromLocalInput = (v) => {
  if (!v) return Date.now();
  const [date, time = '0:0'] = v.split('T');
  const [y, m, d] = date.split('-').map(Number); const [hh, mm] = time.split(':').map(Number);
  return new Date(y, m - 1, d, hh, mm).getTime();
};
const round = (n) => Math.round(n * 10) / 10;

/* ---------- storage (IndexedDB) ---------- */
let _db;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('crashbuster', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const d = await db(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }

/* ---------- state ---------- */
const DEFAULT_MOVES = () => [
  { id: 'm_sub', emoji: '🍓', name: 'Substitution', notes: '' },
  { id: 'm_dis', emoji: '🎧', name: 'Distraction', notes: '' },
  { id: 'm_por', emoji: '🍰', name: 'Smaller portion', notes: '' },
  { id: 'm_read', emoji: '📚', name: 'Reading / listening', notes: '' },
  { id: 'm_heal', emoji: '🥗', name: 'Eating healthy', notes: '' }
];
const MOVE_HINTS = {
  m_sub: 'My go-to swaps: frozen grapes, sparkling water + lime…',
  m_dis: 'Things that work: walk Bear, shower, call someone, color…',
  m_por: 'Half now, half in the fridge / given away / trash, guilt free',
  m_read: 'Currently reading / listening to…',
  m_heal: 'Meals & snacks that keep me steady…'
};
const DEFAULT_STATE = () => ({
  version: 1,
  entries: [], whys: [], goals: [], moves: DEFAULT_MOVES(),
  periodDays: {},
  settings: { apiKey: '', model: 'gemini-3.5-flash', goal: 35, periodGoal: 40, totalFlag: 90 }
});
let state = DEFAULT_STATE();
const ui = { tab: 'today', day: todayKey(), followToday: true, jFilter: 'journal', kit: 'why' };

async function save() { try { await idbSet('state', state); } catch (e) { toast('⚠️ Couldn’t save: ' + e.message); } }

function seed() {
  const t1 = new Date(2026, 10, 4, 23, 53).getTime();
  state.entries.push({
    id: uid(), type: 'journal', ts: t1, title: 'First log 🍩', mood: '😰',
    text: "I had a box of chocolate filled donuts from Nick the Greek. They were delicious with a strange bitterness to it. I had them throughout the day and had 2 more at 8pm with a burger.\n\nAt 11pm almost 12am, my heart is racing, I couldn't sleep, I'm exhausted, I took a hot shower and my heart is still racing. I also feel a little depressed.\n\nThese horrible awful jolts, they feel terrifying. I can't sleep or fall asleep.\n\nIdk how I would do today differently. I tried deep breathing, tapping, caressing my skin. Nothing is helping me fall asleep or get through those jolts."
  });
  const t2 = new Date(2026, 10, 5, 8, 12).getTime();
  state.whys.push(
    { id: uid(), ts: t1, text: 'Heart racing at midnight. Couldn’t sleep. Exhausted, a little depressed. Those horrible awful jolts felt terrifying.', src: 'First log · Nov 4' },
    { id: uid(), ts: t2, text: 'My nervous system is extremely sensitive to sugar and crashes. My brain reads a crash as a catastrophe — then the dominos fall.', src: 'Nov 5' },
    { id: uid(), ts: t2, text: 'I’m ready to listen to my body and stop eating 6 donut bites before bed.', src: 'Nov 5' }
  );
  state.goals.push({

/* ---------- derived data ---------- */
const moveById = (id) => state.moves.find((m) => m.id === id);
const entriesOn = (k) => state.entries.filter((e) => dayKey(e.ts) === k);
const goalFor = (k) => (state.periodDays[k] ? state.settings.periodGoal : state.settings.goal);
const sumGrams = (k) => entriesOn(k).filter((e) => e.type === 'food').reduce((s, e) => s + (Number(e.grams) || 0), 0);
// a day only counts if at least one food/drink was logged (log a 0g meal on sugar-free days)
const sumNatural = (k) => entriesOn(k).filter((e) => e.type === 'food').reduce((s, e) => s + (Number(e.natural) || 0), 0);
const underGoalDay = (k) => entriesOn(k).some((e) => e.type === 'food') && sumGrams(k) <= goalFor(k);

function pointEvents() {
  const ev = [];
  for (const e of state.entries) {
    if (e.type === 'craving') {
      const m = moveById(e.strategy);
      if (m) ev.push({ ts: e.ts, pts: 5, label: `Made a move: ${m.emoji} ${m.name}` });
      const ots = e.outcomeTs || e.ts;
      if (e.outcome === 'resisted') ev.push({ ts: ots, pts: 10, label: `Resisted: ${e.text}` });
      if (e.outcome === 'smaller') ev.push({ ts: ots, pts: 5, label: `Smaller portion: ${e.text}` });
      if (e.outcome === 'gavein') ev.push({ ts: ots, pts: 2, label: `Honest about giving in: ${e.text}` });
    } else if (e.type === 'food' && e.slip) {
      ev.push({ ts: e.ts, pts: 2, label: `Logged a slip honestly: ${e.text || 'photo log'}` });
    } else if (e.type === 'win') {
      ev.push({ ts: e.ts, pts: Number(e.points) || 0, label: e.text });
    }
  }
  for (const g of state.goals) if (g.done && g.doneTs) ev.push({ ts: g.doneTs, pts: 15, label: `Goal reached 🎯 ${g.text.slice(0, 60)}${g.text.length > 60 ? '…' : ''}` });
  const days = new Set(state.entries.map((e) => dayKey(e.ts)));
  const tk = todayKey();
  for (const k of days) {
    if (k < tk && underGoalDay(k)) {
      const d = keyToDate(k); d.setHours(23, 59);
      ev.push({ ts: d.getTime(), pts: 20, label: `Stayed under ${goalFor(k)}g on ${fmtShort(k)} ✨`, bonus: true });
    }
  }
  return ev.sort((a, b) => b.ts - a.ts);
}
function streak() {
  let n = 0, k = addDays(todayKey(), -1); // today counts once it's over
  while (underGoalDay(k)) { n++; k = addDays(k, -1); }
  return n;
}

/* ---------- images ---------- */
function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => rej(new Error('Could not read that image'));
    img.src = url;
  });
}
function resizeImg(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

/* ---------- Gemini ---------- */
const FALLBACK_MODELS = ['gemini-3.5-flash', 'gemini-3-flash', 'gemini-2.5-flash'];
async function gemini(parts) {
  const key = state.settings.apiKey.trim();
  if (!key) throw new Error('Add your Gemini API key in ⚙️ Settings first.');
  const models = [state.settings.model.trim(), ...FALLBACK_MODELS.filter((m) => m !== state.settings.model.trim())];
  let lastErr;
  for (const model of models) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.2 } })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      if (model !== state.settings.model) { state.settings.model = model; save(); }
      const txt = (data.candidates?.[0]?.content?.parts || []).filter((p) => !p.thought).map((p) => p.text || '').join('');
      return JSON.parse(txt.replace(/^```(json)?|```$/g, '').trim());
    }
    lastErr = new Error(data.error?.message || `Gemini error ${res.status}`);
    if (res.status !== 404) break; // only try other models if this one doesn't exist
  }
  throw lastErr;
}
async function estimateSugar(text, imgDataUrl) {
  const prompt = `You help someone track their sugar, split into ADDED sugar (sugar, syrups, honey, juice concentrate etc. added during preparation) and NATURAL sugar (naturally present in whole fruit, plain milk, plain vegetables, etc.).
Estimate the grams of ADDED sugar and NATURAL sugar in the food or drink ${imgDataUrl ? 'shown in the photo and/or ' : ''}described below.
Use any quantities given. If no quantity is given, assume what's visible in the photo or one typical serving, and say what you assumed.
For restaurant or bakery items, estimate from typical recipes. Round to the nearest gram.
Reply ONLY with JSON: {"food":"short name","added_sugar_g":number,"natural_sugar_g":number,"total_sugar_g":number,"confidence":"low"|"medium"|"high","assumptions":"one short friendly sentence"}

Description: ${text || '(none — use the photo)'}`;
  const parts = [{ text: prompt }];
  if (imgDataUrl) parts.push({ inline_data: { mime_type: 'image/jpeg', data: imgDataUrl.split(',')[1] } });
  return gemini(parts);
}

    </div>
    <label for="sFlag">🚩 Heads-up when total sugar (added + natural) passes (g)</label>
    <input id="sFlag" type="number" inputmode="numeric" min="0" value="${st.totalFlag}">
    <p class="hint">Set to 0 to turn the heads-up off.</p>
    <div class="actions"><button class="btn ghost" data-action="closeSheet">Close</button><button class="btn primary" id="save">Save settings</button></div>
    <h3>Backup</h3>
    <p class="hint" style="margin-top:0">Your data lives on this phone only. Export a backup now and then!</p>
    <div style="display:flex;gap:10px"><button class="btn ghost" id="exp" style="flex:1">⬇️ Export</button><button class="btn ghost" id="imp" style="flex:1">⬆️ Import</button></div>
    <input type="file" id="impIn" accept="application/json,.json" hidden>
    <button class="link danger" id="reset" style="margin-top:16px;color:var(--berry)">Erase everything</button>`, (s) => {
    $('#showKey', s).onclick = () => { const k = $('#sKey', s); k.type = k.type === 'password' ? 'text' : 'password'; };
    const apply = () => {
      st.apiKey = $('#sKey', s).value.trim();
      st.model = $('#sModel', s).value.trim() || 'gemini-3.5-flash';
      st.goal = Math.max(1, Number($('#sGoal', s).value) || 35);

    };
    $('#save', s).onclick = () => { apply(); save(); closeSheet(); render(); toast('Settings saved ✔️'); };
    $('#test', s).onclick = async () => {
      apply(); save();
      const out = $('#testOut', s); out.classList.remove('hidden', 'err'); out.textContent = 'Testing…';

      try {
        const data = JSON.parse(await ev.target.files[0].text());
        if (!Array.isArray(data.entries)) throw new Error('That doesn’t look like a Crash Buster backup');
        if (!confirm('Replace everything on this device with this backup?')) return;
        const key = state.settings.apiKey;
        state = Object.assign(DEFAULT_STATE(), data); state.settings = Object.assign(DEFAULT_STATE().settings, data.settings || {});
        if (!state.settings.apiKey) state.settings.apiKey = key;
        await save(); closeSheet(); render(); toast('Backup restored ✔️');
      } catch (err) { toast('😵 ' + err.message); }
    };
    $('#reset', s).onclick = async () => {
      if (!confirm('Erase ALL entries, reasons, goals and settings? This can’t be undone.')) return;
      state = DEFAULT_STATE(); await save(); closeSheet(); render(); toast('Fresh start ✨');
    };
  });
}

/* ---------- misc actions ---------- */
function delEntry(id) {
  if (!confirm('Delete this entry?')) return;
  state.entries = state.entries.filter((x) => x.id !== id); save(); closeSheet(); render(); toast('Deleted');
}
function togglePeriod() {
  const k = ui.day;
  if (state.periodDays[k]) { let d = k; while (state.periodDays[d]) { delete state.periodDays[d]; d = addDays(d, 1); } toast(`Back to ${state.settings.goal}g`); }
  else { for (let i = 0; i < 7; i++) state.periodDays[addDays(k, i)] = true; toast(`🌸 ${state.settings.periodGoal}g goal for the next 7 days. Be gentle with you.`); }
  save(); render();
}

const ACTIONS = {
  tab: (el) => { ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  openSettings, closeSheet,
  dayPrev: () => { ui.day = addDays(ui.day, -1); ui.followToday = false; render(); },
  dayNext: () => { if (ui.day < todayKey()) ui.day = addDays(ui.day, 1); ui.followToday = ui.day === todayKey(); render(); },
  dayToday: () => { ui.day = todayKey(); ui.followToday = true; render(); },
  togglePeriod,
  newFood: () => openFoodSheet(), newCraving: () => openCravingSheet(), newWin: () => openWinSheet(), newJournal: () => openJournalSheet(),
  editEntry: (el) => {
    const e = state.entries.find((x) => x.id === el.dataset.id); if (!e) return;
    ({ food: openFoodSheet, craving: openCravingSheet, win: openWinSheet, journal: openJournalSheet })[e.type](e);
  },
  outcome: (el) => setOutcome(el.dataset.id, el.dataset.v),
  pickMove: (el) => { const e = state.entries.find((x) => x.id === el.dataset.id); if (e) cravingStep2(e); },
  pinWhy: (el) => pinWhy(el.dataset.id),
  jFilter: (el) => { ui.jFilter = el.dataset.v; render(); },
  kit: (el) => { ui.kit = el.dataset.v; render(); },
  newWhy: () => openWhySheet(), editWhy: (el) => openWhySheet(state.whys.find((x) => x.id === el.dataset.id)),
  newMove: () => openMoveSheet(), editMove: (el) => openMoveSheet(moveById(el.dataset.id)),
  newGoal: () => openGoalSheet(), editGoal: (el) => openGoalSheet(state.goals.find((x) => x.id === el.dataset.id))
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  ev.preventDefault(); ev.stopPropagation(); fn(el, ev);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && ui.followToday && ui.day !== todayKey()) { ui.day = todayKey(); render(); }
});

/* ---------- boot ---------- */
(async function boot() {
  try {
    const saved = await idbGet('state');
    if (saved) { state = Object.assign(DEFAULT_STATE(), saved); state.settings = Object.assign(DEFAULT_STATE().settings, saved.settings || {}); }
    else { seed(); await save(); }
  } catch (e) { seed(); toast('⚠️ Storage unavailable — data won’t persist'); }
  render();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
