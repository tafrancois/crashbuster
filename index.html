<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8546B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crash Buster">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2">
<title>Crash Buster</title>
<style>
:root{
  --bg:#FFF7F0; --card:#FFFFFF; --ink:#33203A; --muted:#8A7683; --line:#F0E2DA;
  --berry:#E8546B; --berry-soft:#FDE3E7; --mint:#2FA67D; --mint-soft:#DDF5EC;
  --honey:#D98E1F; --honey-soft:#FCEFD9; --plum:#6B3F7A; --plum-soft:#EFE4F3;
  --shadow:0 2px 12px rgba(80,40,60,.08); --r:18px;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B1420; --card:#261C2C; --ink:#F6EAF0; --muted:#B39FB0; --line:#3A2C40;
    --berry:#FF6F86; --berry-soft:#45222D; --mint:#4FD1A0; --mint-soft:#1E3A30;
    --honey:#F5B95A; --honey-soft:#43341C; --plum:#C79BE0; --plum-soft:#35263F;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
h1,h2,h3,.rounded{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:16px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--berry)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 18px 8px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{margin:0;font-size:24px;letter-spacing:-.01em}
.topbar h1 span{color:var(--berry)}
.streak-badge{height:40px;padding:0 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:15px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--card);box-shadow:var(--shadow)}

main{padding:4px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto}
.tab{display:none}.tab.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.bottomnav button .em{font-size:22px;filter:grayscale(.6);opacity:.7;transition:.15s}
.bottomnav button.active{color:var(--berry)}
.bottomnav button.active .em{filter:none;opacity:1;transform:scale(1.12)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:15px}

/* today */
.daynav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.daynav button.arrow{width:38px;height:38px;border-radius:50%;font-size:22px;background:var(--card);box-shadow:var(--shadow)}
.daynav button.arrow:disabled{opacity:.3}
.daynav .daylabel{font-weight:700;font-size:16px;text-align:center}
.daynav .daylabel small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ring-card{display:flex;flex-direction:column;align-items:center;padding:18px 16px 14px}
.ring{position:relative;width:190px;height:190px}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-size:46px;font-weight:800;line-height:1;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.ring .num small{font-size:20px;font-weight:700}
.ring .of{color:var(--muted);font-size:13px;margin-top:4px}
.status{margin-top:10px;font-weight:600;text-align:center}
.natural-line{margin-top:6px;font-size:13px;color:var(--muted)}
.natural-line b{color:var(--mint)}
.flag{margin-top:10px;background:var(--honey-soft);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;text-align:center;line-height:1.35}
.unknown{font-size:12px;color:var(--honey);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--plum-soft);color:var(--plum);margin-top:12px}
.pill.on{background:var(--plum);color:#fff}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.big3 button{border-radius:var(--r);padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-weight:700;font-size:14px;box-shadow:var(--shadow);transition:transform .1s}
.big3 button:active{transform:scale(.95)}
.big3 .em{font-size:30px}
.b-food{background:var(--honey-soft);color:var(--honey)}
.b-crave{background:var(--berry-soft);color:var(--berry)}
.b-win{background:var(--mint-soft);color:var(--mint)}
.banner{display:flex;gap:10px;align-items:center;background:var(--plum-soft);color:var(--plum);border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600;font-size:14px;width:100%;text-align:left}

/* timeline items */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:left;width:100%}
.item .badge{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg)}
.item.food .badge{background:var(--honey-soft)}
.item.craving .badge{background:var(--berry-soft)}
.item.win .badge{background:var(--mint-soft)}
.item.journal .badge{background:var(--plum-soft)}
.item .body{flex:1;min-width:0}
.item .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.item .txt{font-size:15px;line-height:1.4;word-wrap:break-word}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.item .grams{font-weight:800;font-size:20px;color:var(--honey);white-space:nowrap;font-family:ui-rounded,system-ui,sans-serif}
.item .grams small{font-size:12px}
.item .grams{text-align:right}
.item .grams .nat{font-size:11px;font-weight:600;color:var(--mint);font-family:-apple-system,system-ui,sans-serif}
.item .pts{font-weight:800;color:var(--mint);white-space:nowrap}
.item .thumb{width:52px;height:52px;object-fit:cover;border-radius:10px}
.item.slip{outline:1.5px dashed var(--berry)}
.outcomes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.outcomes button{font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line)}
.outcomes .o-res{color:var(--mint);border-color:var(--mint)}
.outcomes .o-sm{color:var(--honey);border-color:var(--honey)}
.outcomes .o-gi{color:var(--berry);border-color:var(--berry)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:6px;margin-right:4px}
.t-res{background:var(--mint-soft);color:var(--mint)}
.t-sm{background:var(--honey-soft);color:var(--honey)}
.t-gi{background:var(--berry-soft);color:var(--berry)}
.t-move{background:var(--plum-soft);color:var(--plum)}
.j-title{font-weight:700;font-size:16px;margin-bottom:4px}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.small-actions{display:flex;gap:14px;margin-top:8px}
.small-actions button{font-size:13px;font-weight:700;color:var(--plum)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav .arrow{width:38px;height:38px;border-radius:50%;font-size:22px;background:var(--bg)}
.cal-nav .arrow:disabled{opacity:.3}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head div{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding-bottom:4px}
.cal-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:15px;background:var(--bg)}
.cal-day:disabled{opacity:.3}
.cal-day.today{outline:2px solid var(--berry)}
.cal-day.sel{background:var(--berry);color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:transparent}
.dot.under{background:var(--mint)} .dot.over{background:var(--honey)} .dot.logged{background:var(--plum)} .dot.open{background:var(--line);box-shadow:inset 0 0 0 1.5px var(--muted)}
.cal-day.sel .dot{box-shadow:0 0 0 1.5px #fff}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.wk-row{display:grid;grid-template-columns:70px 1fr 64px;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left}
.wk-row.sel{outline:2px solid var(--berry)}
.wk-row:disabled{opacity:.35}
.wk-day{font-weight:800}.wk-day small,.wk-g small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.wk-bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.wk-bar span{display:block;height:100%;background:var(--mint);border-radius:9px}
.wk-bar span.over{background:var(--honey)}
.wk-g{text-align:right;font-weight:800}
.dayhead{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 2px}

/* chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:12px -2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
.seg button{padding:10px 4px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--berry);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:15px}
.primary{background:var(--berry);color:#fff}
.ghost{background:var(--bg);border:1.5px solid var(--line)}
.danger{color:var(--berry)}
.wide{width:100%}
.link{color:var(--plum);font-weight:700;font-size:14px;padding:6px 0}

/* toolkit */
.why-card{background:linear-gradient(135deg,var(--berry-soft),var(--plum-soft));border-radius:var(--r);padding:18px;position:relative;text-align:left;width:100%}
.why-card .why-label{font-size:12px;font-weight:800;color:var(--berry);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.why-card .why-text{font-size:17px;line-height:1.45;font-weight:600;white-space:pre-wrap}
.why-card .why-src{font-size:12px;color:var(--muted);margin-top:8px}
.move-card .head{display:flex;align-items:center;gap:10px}
.move-card .em{font-size:28px}
.move-card .name{font-weight:800;font-size:17px}
.move-card .stats{font-size:12px;color:var(--muted)}
.move-card .notes{margin-top:8px;font-size:14px;white-space:pre-wrap;line-height:1.4}
.goal-card .txt{font-size:15px;line-height:1.45;white-space:pre-wrap}
.goal-card .meta{font-size:12px;color:var(--muted);margin-top:8px}
.goal-card.due{outline:2px solid var(--plum)}
.goal-card.done{opacity:.65}

/* wins */
.score{text-align:center;padding:22px 16px}
.score .big{font-size:64px;font-weight:900;line-height:1;color:var(--mint);font-family:ui-rounded,system-ui,sans-serif}
.score .lbl{font-weight:700;color:var(--muted);margin-top:4px}
.score .vibe{font-size:18px;font-weight:800;margin-top:10px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stats3 .card{text-align:center;padding:12px 6px}
.stats3 b{display:block;font-size:22px;font-family:ui-rounded,system-ui,sans-serif}
.stats3 span{font-size:12px;color:var(--muted);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin-top:8px}
.bars .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted);font-weight:700}
.bars .fill{width:100%;border-radius:8px 8px 4px 4px;background:var(--mint);min-height:4px}
.bars .bar.today .fill{background:var(--berry)}
.bars .v{color:var(--ink)}
.pbars{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;margin-top:10px}
.pbars .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--muted);font-weight:700}
.pbars .fill{width:100%;border-radius:8px 8px 4px 4px;background:var(--mint)}
.pbars .fill.over{background:var(--honey)}
.pbars .bar.today .fill{outline:2px solid var(--berry);outline-offset:1px}
.pbars .v{color:var(--ink)}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--berry);opacity:.6;pointer-events:none}
.compare{margin-top:12px;background:var(--mint-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.prog-card{text-align:left;width:100%}
.prog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-area{font-weight:800;font-size:15px}
.prog-row{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;margin-top:6px}
.prog-row .lbl{flex:0 0 46px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 0;border-radius:6px;text-align:center}
.lbl.then{background:var(--line);color:var(--muted)}
.lbl.now{background:var(--mint-soft);color:var(--mint)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(30,15,30,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{overscroll-behavior:contain;touch-action:pan-y;will-change:transform;background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease;-webkit-overflow-scrolling:touch}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.actions{display:flex;gap:10px;margin-top:20px;align-items:center}
.actions .primary{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.photo-box{border:2px dashed var(--line);border-radius:16px;min-height:120px;display:grid;place-items:center;color:var(--muted);font-weight:700;overflow:hidden;width:100%}
.photo-box img{width:100%;max-height:260px;object-fit:cover;display:block}
.ai{width:100%;margin-top:10px;padding:13px;border-radius:14px;font-weight:800;background:linear-gradient(90deg,var(--plum),var(--berry));color:#fff}
.ai:disabled{opacity:.6}
.thinking{display:flex;align-items:center;gap:12px}
.th-anim{position:relative;width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center}
.th-em{font-size:30px;display:inline-block;animation:donut-spin 1.1s ease-in-out infinite}
.thinking.web .th-em{animation:magnify 1.6s ease-in-out infinite}
.th-anim i{position:absolute;width:5px;height:12px;border-radius:3px;top:50%;left:50%;opacity:0;animation:sprinkle 1.1s ease-out infinite}
.th-anim i:nth-child(2){background:#FFD166;--dx:-18px;--dy:-20px;--r:-30deg}
.th-anim i:nth-child(3){background:#6EE7B7;--dx:20px;--dy:-16px;--r:40deg;animation-delay:.35s}
.th-anim i:nth-child(4){background:#FF8FA3;--dx:4px;--dy:-26px;--r:10deg;animation-delay:.7s}
.th-txt{flex:1;min-width:0}
.th-txt b{display:block;font-size:14px;transition:opacity .2s}
.th-bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:7px;position:relative}
.th-bar span{position:absolute;inset:0;width:40%;border-radius:9px;background:linear-gradient(90deg,var(--plum),var(--berry));animation:slide 1.3s ease-in-out infinite}
.th-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--plum);min-width:44px;text-align:right}
@keyframes donut-spin{0%{transform:rotate(0) translateY(0)}40%{transform:rotate(200deg) translateY(-5px)}100%{transform:rotate(360deg) translateY(0)}}
@keyframes magnify{0%,100%{transform:translate(-6px,2px) rotate(-10deg)}50%{transform:translate(6px,-3px) rotate(12deg) scale(1.12)}}
@keyframes sprinkle{0%{opacity:0;transform:translate(-50%,-50%)}25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r))}}
@keyframes slide{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion: reduce){.th-em,.th-anim i,.th-bar span{animation:none}.th-bar span{left:0;width:100%;opacity:.5}}
.ai-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ai-row .ai{margin-top:0;font-size:14px;padding:13px 8px}
.ai-web{background:var(--card);color:var(--plum);border:2px solid var(--plum)}
.ai-out .srcs{margin-top:8px;font-size:12.5px;line-height:1.5}
.ai-out .srcs a{color:var(--plum);font-weight:700;word-break:break-word}
.ai-out{margin-top:10px;background:var(--plum-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.ai-out.err{background:var(--berry-soft)}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px;font-weight:600;margin-top:16px}
.check input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--berry);margin-top:1px}
.check small{display:block;color:var(--muted);font-weight:500}
.pickrow{display:flex;flex-wrap:wrap;gap:8px}
.pickrow button{padding:9px 13px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.pickrow button.on{background:var(--berry);border-color:var(--berry);color:#fff}
.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.move-pick{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.move-pick .em{font-size:26px}
.move-pick small{color:var(--muted);font-size:12px;line-height:1.3}
.move-pick:active{transform:scale(.96)}
.mf{background:var(--bg);border-radius:16px;padding:12px;margin-bottom:12px}
.mf-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mf-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;font-weight:600;font-size:15px}
.mf-item.on{border-color:var(--berry);background:var(--berry-soft)}
.mf-sort button{padding:8px 4px;font-size:13px}
#mfAdd{position:sticky;bottom:8px;z-index:2;box-shadow:0 6px 18px rgba(232,84,107,.35)}
.mf-name{display:flex;align-items:center;gap:8px;min-width:0}
.mf-pic{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:0 0 36px}
.fpic-wrap{position:relative}
.fpic{width:46px;height:46px;border-radius:10px;background:var(--bg);border:1.5px dashed var(--line);display:grid;place-items:center;font-size:18px;overflow:hidden;padding:0}
.fpic img{width:100%;height:100%;object-fit:cover}
.fpic-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center}

.meal-chips button span{font-size:11.5px;font-weight:700;color:var(--muted)}
.meal-chips button.on{background:var(--honey-soft);border-color:var(--honey)}
.meal-chips button.on span{color:var(--honey)}
.meal-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.meal-quick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:12px;font-weight:700;color:var(--muted)}
.meal-quick button span{font-size:22px}
.meal-quick button.now{color:var(--honey);outline:2px solid var(--honey-soft)}
.meal-sum{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:700}

.mf-item.on .mf-check{background:var(--berry);border-color:var(--berry)}

.mf-row{display:grid;gap:6px;margin-bottom:8px;align-items:center}

.qw-row .qd{font-size:18px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<body>
<header class="topbar">
  <h1>Crash <span>Buster</span> 💥</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="streak-badge" id="streakBadge" data-action="tab" data-tab="wins" aria-label="Check-in streak"></button>
    <button class="icon-btn" data-action="openSettings" aria-label="Settings">⚙️</button>
  </div>
</header>

<main>
  <section id="tab-today" class="tab active"></section>
  <section id="tab-journal" class="tab"></section>
  <section id="tab-toolkit" class="tab"></section>
  <section id="tab-progress" class="tab"></section>
  <section id="tab-wins" class="tab"></section>
</main>

<nav class="bottomnav">
  <button data-action="tab" data-tab="today" class="active"><span class="em">🏠</span>Today</button>
  <button data-action="tab" data-tab="journal"><span class="em">📖</span>Journal</button>
  <button data-action="tab" data-tab="toolkit"><span class="em">🧰</span>Toolkit</button>
  <button data-action="tab" data-tab="progress"><span class="em">📈</span>Progress</button>
  <button data-action="tab" data-tab="wins"><span class="em">🏆</span>Wins</button>
</nav>

<div id="sheetWrap" class="sheet-wrap hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const keyToDate = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d.getTime()); };
const todayKey = () => dayKey(Date.now());
const weekStartKey = (k) => { const d = keyToDate(k); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return dayKey(d.getTime()); };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDay = (k) => keyToDate(k).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
const fmtShort = (k) => keyToDate(k).toLocaleDateString([], { month: 'short', day: 'numeric' });
const fmtDateTime = (ts) => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const toLocalInput = (ts) => { const d = new Date(ts); return `${dayKey(ts)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fromLocalInput = (v) => {
  if (!v) return Date.now();
  const [date, time = '0:0'] = v.split('T');
  const [y, m, d] = date.split('-').map(Number); const [hh, mm] = time.split(':').map(Number);
  return new Date(y, m - 1, d, hh, mm).getTime();
};
const round = (n) => Math.round(n * 10) / 10;

/* ---------- storage (IndexedDB) ---------- */
let _db;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('crashbuster', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const d = await db(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }

/* ---------- state ---------- */
const DEFAULT_MOVES = () => [
  { id: 'm_sub', emoji: '🍓', name: 'Substitution', notes: '' },
  { id: 'm_dis', emoji: '🎧', name: 'Distraction', notes: '' },
  { id: 'm_por', emoji: '🍰', name: 'Smaller portion', notes: '' },
  { id: 'm_read', emoji: '📚', name: 'Reading / listening', notes: '' },
  { id: 'm_heal', emoji: '🥗', name: 'Eating healthy', notes: '' }
];
const MOVE_HINTS = {
  m_sub: 'My go-to swaps: frozen grapes, sparkling water + lime…',
  m_dis: 'Things that work: walk Bear, shower, call someone, color…',
  m_por: 'Half now, half in the fridge / given away / trash, guilt free',
  m_read: 'Currently reading / listening to…',
  m_heal: 'Meals & snacks that keep me steady…'
};
const DEFAULT_QUICK_WINS = () => [
  ['📚', 'Read / listened to my book', 5], ['🥗', 'Ate something nourishing', 5], ['🍓', 'Made a swap', 5],
  ['🚶‍♀️', 'Moved my body instead', 5], ['💧', 'Drank water first', 5], ['🌙', 'No sugar after dinner', 10],
  ['😴', 'Slept without a crash', 10], ['🍰', 'Ate half, saved half', 5], ['🧘‍♀️', 'Ate it mindfully, no multitasking', 5]
].map(([emoji, text, points], i) => ({ id: 'qw' + i, emoji, text, points }));
const DEFAULT_STATE = () => ({
  version: 1,
  entries: [], whys: [], goals: [], moves: DEFAULT_MOVES(), quickWins: DEFAULT_QUICK_WINS(), foods: [], progress: [], openDays: {},
  periodDays: {},
  settings: { apiKey: '', model: 'gemini-3.7-flash', goal: 35, periodGoal: 40, totalFlag: 90, trackNatural: true, webSearch: true, useBackups: true, modelList: [] }
});
let state = DEFAULT_STATE();
const ui = { tab: 'today', day: todayKey(), followToday: true, jFilter: 'journal', kit: 'why' };

async function save() { try { await idbSet('state', state); } catch (e) { toast('⚠️ Couldn’t save: ' + e.message); } }

function seed() {
  const t1 = new Date(2026, 10, 4, 23, 53).getTime();
  state.entries.push({
    id: uid(), type: 'journal', ts: t1, title: 'First log 🍩', mood: '😰',
    text: "I had a box of chocolate filled donuts from Nick the Greek. They were delicious with a strange bitterness to it. I had them throughout the day and had 2 more at 8pm with a burger.\n\nAt 11pm almost 12am, my heart is racing, I couldn't sleep, I'm exhausted, I took a hot shower and my heart is still racing. I also feel a little depressed.\n\nThese horrible awful jolts, they feel terrifying. I can't sleep or fall asleep.\n\nIdk how I would do today differently. I tried deep breathing, tapping, caressing my skin. Nothing is helping me fall asleep or get through those jolts."
  });
  const t2 = new Date(2026, 10, 5, 8, 12).getTime();
  state.whys.push(
    { id: uid(), ts: t1, text: 'Heart racing at midnight. Couldn’t sleep. Exhausted, a little depressed. Those horrible awful jolts felt terrifying.', src: 'First log · Nov 4' },
    { id: uid(), ts: t2, text: 'My nervous system is extremely sensitive to sugar and crashes. My brain reads a crash as a catastrophe — then the dominos fall.', src: 'Nov 5' },
    { id: uid(), ts: t2, text: 'I’m ready to listen to my body and stop eating 6 donut bites before bed.', src: 'Nov 5' }
  );
  state.goals.push({
    id: uid(), ts: t2, done: false, doneTs: null, checkIn: '2026-11-19',
    text: 'For portions, I want to start by taking any dessert I’m eating or drinking and only eat half of it. The other half can go in the trash guilt free, be given away, or put in the fridge. After two weeks, I want to decrease half to 1/3.'
  }, {
    id: uid(), ts: t2 + 60000, done: false, doneTs: null, checkIn: '',
    text: 'Any time I eat or drink something with added sugar, I do it mindfully, focusing on the flavor without multitasking.'
  });
}

/* ---------- derived data ---------- */
const moveById = (id) => state.moves.find((m) => m.id === id);
const entriesOn = (k) => state.entries.filter((e) => dayKey(e.ts) === k);
const goalFor = (k) => (state.periodDays[k] ? state.settings.periodGoal : state.settings.goal);
const sumGrams = (k) => entriesOn(k).filter((e) => e.type === 'food').reduce((s, e) => s + (Number(e.grams) || 0), 0);
// a day only counts if at least one food/drink was logged (log a 0g meal on sugar-free days)
const sumNatural = (k) => entriesOn(k).filter((e) => e.type === 'food').reduce((s, e) => s + (Number(e.natural) || 0), 0);
const underGoalDay = (k) => entriesOn(k).some((e) => e.type === 'food') && sumGrams(k) <= goalFor(k);

function pointEvents() {
  const ev = [];
  for (const e of state.entries) {
    if (e.type === 'craving') {
      const m = moveById(e.strategy);
      if (m) ev.push({ ts: e.ts, pts: 5, label: `Made a move: ${m.emoji} ${m.name}` });
      const ots = e.outcomeTs || e.ts;
      if (e.outcome === 'resisted') ev.push({ ts: ots, pts: 10, label: `Resisted: ${e.text}` });
      if (e.outcome === 'smaller') ev.push({ ts: ots, pts: 5, label: `Smaller portion: ${e.text}` });
      if (e.outcome === 'gavein') ev.push({ ts: ots, pts: 2, label: `Honest about giving in: ${e.text}` });
    } else if (e.type === 'food' && e.slip) {
      ev.push({ ts: e.ts, pts: 2, label: `Logged a slip honestly: ${e.text || 'photo log'}` });
    } else if (e.type === 'win') {
      ev.push({ ts: e.ts, pts: Number(e.points) || 0, label: e.text });
    }
  }
  // daily check-ins (bonus grows with your streak)
  const act = [...activeDays()].sort(); let run = 0, prev = null;
  for (const k of act) {
    run = prev && addDays(prev, 1) === k ? run + 1 : 1; prev = k;
    const d = keyToDate(k); d.setHours(0, 1);
    ev.push({ ts: d.getTime(), pts: checkinPts(run), label: run > 1 ? `Checked in · day ${run} streak 🔥` : 'Checked in 👋', bonus: true, checkin: true });
  }
  for (const p of state.progress || []) ev.push({ ts: p.ts, pts: 5, label: `Noticed progress: ${p.area}` });
  for (const g of state.goals) if (g.done && g.doneTs) ev.push({ ts: g.doneTs, pts: 15, label: `Goal reached 🎯 ${g.text.slice(0, 60)}${g.text.length > 60 ? '…' : ''}` });
  const days = new Set(state.entries.map((e) => dayKey(e.ts)));
  const tk = todayKey();
  for (const k of days) {
    if (k < tk && underGoalDay(k)) {
      const d = keyToDate(k); d.setHours(23, 59);
      ev.push({ ts: d.getTime(), pts: 20, label: `Stayed under ${goalFor(k)}g on ${fmtShort(k)} ✨`, bonus: true });
    }
  }
  return ev.sort((a, b) => b.ts - a.ts);
}
// days the app was opened (or anything was logged — logging means it was opened)
function activeDays() {
  const set = new Set(Object.keys(state.openDays || {}));
  for (const e of state.entries) set.add(dayKey(e.ts));
  return set;
}
function openStreak(k = todayKey()) { const a = activeDays(); let n = 0; while (a.has(k)) { n++; k = addDays(k, -1); } return n; }
const checkinPts = (n) => 2 + Math.min(Math.max(n, 1) - 1, 10); // +2 base, +1 per streak day, max +12
function markOpen() {
  const k = todayKey(); state.openDays = state.openDays || {};
  if (state.openDays[k]) return;
  state.openDays[k] = true; save();
  const n = openStreak(k);
  setTimeout(() => toast(n > 1 ? `🔥 Day ${n} check-in streak! +${checkinPts(n)}` : `👋 Checked in for today! +${checkinPts(1)}`), 600);
}
function streak() {
  let n = 0, k = addDays(todayKey(), -1); // today counts once it's over
  while (underGoalDay(k)) { n++; k = addDays(k, -1); }
  return n;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

/* ---------- sheet ---------- */
function openSheet(html, mount) {
  const s = $('#sheet'); s.innerHTML = html; $('#sheetWrap').classList.remove('hidden');
  s.scrollTop = 0; document.body.style.overflow = 'hidden';
  if (mount) mount(s);
}
function closeSheet() { $('#sheetWrap').classList.add('hidden'); $('#sheet').innerHTML = ''; document.body.style.overflow = ''; }
$('#sheetWrap').addEventListener('click', (e) => { if (e.target.id === 'sheetWrap') closeSheet(); });
// swipe down to dismiss (when the sheet is scrolled to the top)
(() => {
  const sh = $('#sheet'); let y0 = 0, dy = 0, t0 = 0, dragging = false, armed = false;
  sh.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    armed = sh.scrollTop <= 0; dragging = false; y0 = e.touches[0].clientY; dy = 0; t0 = Date.now();
  }, { passive: true });
  sh.addEventListener('touchmove', (e) => {
    if (!armed) return;
    dy = e.touches[0].clientY - y0;
    if (!dragging && dy > 8 && sh.scrollTop <= 0) { dragging = true; sh.style.transition = 'none'; document.activeElement?.blur?.(); }
    if (dragging) { e.preventDefault(); sh.style.transform = `translateY(${Math.max(0, dy)}px)`; }
    else if (dy < 0) armed = false; // scrolling up: let it scroll normally
  }, { passive: false });
  const end = () => {
    if (!dragging) return; dragging = false;
    const fast = dy / Math.max(1, Date.now() - t0) > 0.6;
    sh.style.transition = 'transform .22s ease';
    if (dy > 130 || (fast && dy > 90)) { sh.style.transform = 'translateY(100%)'; setTimeout(() => { closeSheet(); sh.style.transform = ''; sh.style.transition = ''; }, 200); }
    else { sh.style.transform = ''; setTimeout(() => { sh.style.transition = ''; }, 230); }
  };
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
})();

function defaultTs() {
  if (ui.day === todayKey()) return Date.now();
  const d = keyToDate(ui.day); const n = new Date(); d.setHours(n.getHours(), n.getMinutes()); return d.getTime();
}

/* ---------- entry cards ---------- */
function entryCard(e, showDate = false) {
  const time = showDate ? fmtDateTime(e.ts) : fmtTime(e.ts);
  if (e.type === 'food') {
    return `<button class="item food ${e.slip ? 'slip' : ''}" data-action="editEntry" data-id="${e.id}">
      <div class="badge">${e.slip ? '🎂' : '🍽️'}</div>
      <div class="body"><div class="meta">${time} · ${mealOf(e.ts).em} ${mealOf(e.ts).name}${e.slip ? ' · slip, logged honestly 💛' : ''}</div>
        <div class="txt">${e.text ? esc(e.text) : '<i>Photo log</i>'}</div>
        ${e.aiNote ? `<div class="sub">✨ ${esc(e.aiNote)}</div>` : ''}</div>
      ${e.photo ? `<img class="thumb" src="${esc(e.photo)}" alt="">` : ''}
      <div class="grams">${e.grams == null || e.grams === '' ? '?' : round(Number(e.grams))}<small>g</small>
        ${state.settings.trackNatural ? `<div class="nat">${e.natural ? `+${round(Number(e.natural))}g natural` : 'added'}</div>` : ''}</div>
    </button>`;
  }
  if (e.type === 'craving') {
    const m = moveById(e.strategy);
    const tags = [];
    if (e.intensity) tags.push(`<span class="tag t-gi">${'🔥'.repeat(e.intensity)}</span>`);
    if (m) tags.push(`<span class="tag t-move">${m.emoji} ${esc(m.name)}</span>`);
    if (e.outcome === 'resisted') tags.push('<span class="tag t-res">💪 Resisted +10</span>');
    if (e.outcome === 'smaller') tags.push('<span class="tag t-sm">🍰 Smaller portion +5</span>');
    if (e.outcome === 'gavein') tags.push('<span class="tag t-gi">🎂 Gave in · honest +2</span>');
    const pending = !e.outcome ? `<div class="outcomes">
        ${!m ? `<button data-action="pickMove" data-id="${e.id}">🧰 Pick a move</button>` : ''}
        <button class="o-res" data-action="outcome" data-v="resisted" data-id="${e.id}">💪 Resisted</button>
        <button class="o-sm" data-action="outcome" data-v="smaller" data-id="${e.id}">🍰 Smaller portion</button>
        <button class="o-gi" data-action="outcome" data-v="gavein" data-id="${e.id}">🎂 Gave in</button>
      </div>` : '';
    return `<div class="item craving" data-action="editEntry" data-id="${e.id}" role="button">
      <div class="badge">😭</div>
      <div class="body"><div class="meta">${time} · craving</div>
        <div class="txt">${esc(e.text)}</div>${tags.join('')}${pending}</div>
    </div>`;
  }
  if (e.type === 'win') {
    return `<button class="item win" data-action="editEntry" data-id="${e.id}">
      <div class="badge">🏆</div>
      <div class="body"><div class="meta">${time} · win</div><div class="txt">${esc(e.text)}</div></div>
      <div class="pts">+${Number(e.points) || 0}</div></button>`;
  }
  if (e.type === 'journal') {
    return `<div class="item journal" data-action="editEntry" data-id="${e.id}" role="button">
      <div class="badge">${esc(e.mood || '✍️')}</div>
      <div class="body"><div class="meta">${time} · reflection</div>
        ${e.title ? `<div class="j-title">${esc(e.title)}</div>` : ''}
        <div class="txt clamp">${esc(e.text)}</div>
        <div class="small-actions"><button data-action="pinWhy" data-id="${e.id}">📌 Pin to My Why</button></div>
      </div></div>`;
  }
  return '';
}

/* ---------- TODAY ---------- */
function renderToday() {
  const k = ui.day, tk = todayKey(), isToday = k === tk;
  const grams = round(sumGrams(k)), goal = goalFor(k), p = goal ? grams / goal : 0;
  const C = 2 * Math.PI * 80, off = C * (1 - Math.min(p, 1));
  const color = p > 1 ? 'var(--berry)' : p >= 0.75 ? 'var(--honey)' : 'var(--mint)';
  const unknown = entriesOn(k).filter((e) => e.type === 'food' && (e.grams == null || e.grams === '')).length;
  let status;
  if (grams === 0) status = isToday ? 'Clean slate ✨' : 'No sugar logged';
  else if (grams < goal) status = `${round(goal - grams)}g left in ${isToday ? "today's" : 'the'} budget`;
  else if (grams === goal) status = 'Right at your goal — perfect landing 🎯';
  else status = `${round(grams - goal)}g over — 💅🏾 girl, it’s okay`;
  const natural = round(sumNatural(k));
  const period = !!state.periodDays[k];
  const due = isToday ? state.goals.filter((g) => !g.done && g.checkIn && g.checkIn <= tk) : [];
  const items = entriesOn(k).sort((a, b) => b.ts - a.ts);

  $('#tab-today').innerHTML = `
    <div class="daynav">
      <button class="arrow" data-action="dayPrev" aria-label="Previous day">‹</button>
      <button class="daylabel" data-action="openCalendar">${isToday ? 'Today' : fmtDay(k)}<small>📅 ${isToday ? fmtDay(k) : 'tap for calendar'}</small></button>
      <button class="arrow" data-action="dayNext" ${isToday ? 'disabled' : ''} aria-label="Next day">›</button>
    </div>
    <div class="card ring-card">
      <div class="ring">
        <svg width="190" height="190" viewBox="0 0 190 190">
          <circle cx="95" cy="95" r="80" fill="none" stroke="var(--line)" stroke-width="16"/>

const MEALS = [

// Breakfast 6–11am · Lunch 11am–4pm · Dinner 4–9pm · Late night 9pm–6am
const mealOf = (ts) => { const h = new Date(ts).getHours(); return h >= 6 && h < 11 ? MEALS[0] : h >= 11 && h < 16 ? MEALS[1] : h >= 16 && h < 21 ? MEALS[2] : MEALS[3]; };
// a time inside the meal window on that day — uses "now" if you're in that window today
function mealTime(id, dayK = ui.day) {

  if (dayK === todayKey() && mealOf(now).id === id) return now;

}

/* ---------- CALENDAR ---------- */
function dayStatus(k) {
  const es = entriesOn(k); if (!es.length) return state.openDays?.[k] ? 'open' : '';
  if (!es.some((e) => e.type === 'food')) return 'logged';
  return sumGrams(k) <= goalFor(k) ? 'under' : 'over';
}
function openCalendar() {
  let view = ui.calView || 'month';
  const sel = ui.day, tk = todayKey();
  let month = keyToDate(sel); month.setDate(1);
  let wk = weekStartKey(sel);
  const go = (k) => { if (k > tk) return; ui.day = k; ui.followToday = k === tk; closeSheet(); ui.tab = 'today'; render(); window.scrollTo(0, 0); };
  const dot = (k) => { const st = dayStatus(k); return st ? `<i class="dot ${st}"></i>` : '<i class="dot"></i>'; };
  const draw = (s) => {
    let body = '';
    if (view === 'month') {
      const y = month.getFullYear(), m = month.getMonth();
      const firstK = dayKey(new Date(y, m, 1).getTime()), lead = (new Date(y, m, 1).getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate();
      const cells = [...Array(lead)].map(() => '<div></div>').concat([...Array(nd)].map((_, i) => {
        const k = addDays(firstK, i), fut = k > tk;
        return `<button class="cal-day ${k === sel ? 'sel' : ''} ${k === tk ? 'today' : ''}" data-k="${k}" ${fut ? 'disabled' : ''}>${i + 1}${dot(k)}</button>`;
      }));
      const nextOk = dayKey(new Date(y, m + 1, 1).getTime()) <= tk;
      body = `<div class="cal-nav"><button class="arrow" id="prev">‹</button><b>${month.toLocaleDateString([], { month: 'long', year: 'numeric' })}</b><button class="arrow" id="next" ${nextOk ? '' : 'disabled'}>›</button></div>
        <div class="cal-grid cal-head">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d) => `<div>${d}</div>`).join('')}</div>
        <div class="cal-grid">${cells.join('')}</div>`;
    } else {
      const rows = [...Array(7)].map((_, i) => {
        const k = addDays(wk, i), fut = k > tk, g = round(sumGrams(k)), goal = goalFor(k), n = entriesOn(k).length;
        const pct = Math.min(100, Math.round((g / goal) * 100));
        return `<button class="wk-row ${k === sel ? 'sel' : ''}" data-k="${k}" ${fut ? 'disabled' : ''}>
          <span class="wk-day">${keyToDate(k).toLocaleDateString([], { weekday: 'short' })}<small>${fmtShort(k)}</small></span>
          <span class="wk-bar"><span class="${g > goal ? 'over' : ''}" style="width:${pct}%"></span></span>
          <span class="wk-g">${fut ? '' : n ? `${g}g` : '—'}<small>${fut ? '' : n ? `${n} log${n > 1 ? 's' : ''}` : ''}</small></span></button>`;
      }).join('');
      const nextOk = addDays(wk, 7) <= tk;
      body = `<div class="cal-nav"><button class="arrow" id="prev">‹</button><b>${fmtShort(wk)} – ${fmtShort(addDays(wk, 6))}</b><button class="arrow" id="next" ${nextOk ? '' : 'disabled'}>›</button></div>
        <div class="list" style="gap:6px">${rows}</div>`;
    }
    s.innerHTML = `
      <div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
        <button class="${view === 'week' ? 'on' : ''}" data-v="week">Week</button><button class="${view === 'month' ? 'on' : ''}" data-v="month">Month</button>
      </div>${body}
      <div class="cal-legend"><span><i class="dot under"></i>under goal</span><span><i class="dot over"></i>over goal</span><span><i class="dot logged"></i>logged, no food</span><span><i class="dot open"></i>opened</span></div>
      <button class="btn ghost wide" id="todayBtn" style="margin-top:14px">Jump to today</button>`;
    $$('.seg button', s).forEach((b) => b.onclick = () => { view = ui.calView = b.dataset.v; draw(s); });
    $$('[data-k]', s).forEach((b) => b.onclick = () => go(b.dataset.k));
    $('#prev', s).onclick = () => { if (view === 'month') month.setMonth(month.getMonth() - 1); else wk = addDays(wk, -7); draw(s); };
    $('#next', s).onclick = () => { if (view === 'month') month.setMonth(month.getMonth() + 1); else wk = addDays(wk, 7); draw(s); };
    $('#todayBtn', s).onclick = () => go(tk);
  };
  openSheet('<div></div>', (s) => draw(s));
}

function weekAvg(wk) {

  for (let i = 0; i < 7; i++) { const k = addDays(wk, i); if (k > tk) break; if (entriesOn(k).some((e) => e.type === 'food')) { sum += sumGrams(k); n++; } }
  return n ? { avg: round(sum / n), days: n } : null;
}

/* ---------- images ---------- */
function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => rej(new Error('Could not read that image'));
    img.src = url;
  });
}
function resizeImg(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

/* ---------- Gemini ---------- */
const FALLBACK_MODELS = ['gemini-3.7-flash', 'gemini-3.5-flash', 'gemini-3-flash'];
// backups: prefer models your key actually has (from Settings → 🔄), newest Flash models only — never old/lite ones
function backupModels(chosen) {
  const fromKey = (state.settings.modelList || []).map((m) => m.id).filter((id) => /flash/.test(id) && !/lite|preview|exp/i.test(id));
  const pool = fromKey.length ? fromKey : FALLBACK_MODELS;
  return pool.filter((m) => m !== chosen).slice(0, 2);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let lastModelUsed = '', lastSearched = false, lastSources = [], lookupRetried = false;
async function gemini(parts, opts = {}) {
  let useSearch = !!opts.search;
  const key = state.settings.apiKey.trim();
  if (!key) throw new Error('Add your Gemini API key in ⚙️ Settings first.');
  const chosen = state.settings.model.trim();
  const models = state.settings.useBackups ? [chosen, ...backupModels(chosen)] : [chosen];
  let lastErr, busy = false; const errs = [];
  for (const model of models) {
    useSearch = !!opts.search;
    for (let attempt = 0; attempt < 2; attempt++) {
      let res, data;
      try {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
          body: JSON.stringify(useSearch
            ? { contents: [{ parts }], tools: [{ google_search: {} }], generationConfig: { temperature: 0.2 } }
            : { contents: [{ parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.2 } })
        });
        data = await res.json().catch(() => ({}));
      } catch (e) { throw new Error('Couldn’t reach Gemini — are you online?'); }
      if (res.ok) {
        lastModelUsed = model;
        const gm = data.candidates?.[0]?.groundingMetadata || {};
        lastSearched = !!(gm.webSearchQueries?.length || gm.groundingChunks?.length);
        lastSources = (gm.groundingChunks || []).map((c) => c.web).filter((w) => w && w.uri)
          .filter((w, i, a) => a.findIndex((x) => (x.title || x.uri) === (w.title || w.uri)) === i).slice(0, 4);
        const txt = (data.candidates?.[0]?.content?.parts || []).filter((p) => !p.thought).map((p) => p.text || '').join('');
        return parseGeminiJSON(txt, model, data);
      }
      lastErr = new Error(`${data.error?.message || 'Gemini error'} [${model} · ${res.status}]`);
      if (!errs.some((x) => x.startsWith(model))) errs.push(`${model}: ${data.error?.message || res.status}`);
      if (useSearch && res.status === 400 && /tool|search|grounding/i.test(lastErr.message)) {
        if (opts.force) break;                      // forced lookup: try a model that CAN search
        useSearch = false; attempt--; continue;     // normal estimate: retry without searching
      }
      if (res.status === 404) break;      // model doesn't exist: try next model
      if (res.status === 429 || res.status >= 500) { busy = true; if (attempt === 0) { await sleep(1200); continue; } break; } // busy: retry once, then next model
      if (res.status === 400 && /api key/i.test(lastErr.message)) throw new Error('Google says that API key isn’t valid. Double-check you copied the whole thing.');
      throw lastErr; // anything else (bad key, etc.) — stop
    }
  }
  if (opts.force) throw new Error('Couldn’t get a web lookup to go through 😩 ' + (busy ? 'Gemini is busy — try again in a minute. ' : '') + (errs.length ? `Your model said: “${errs[0]}”` : ''));
  if (busy) throw new Error('All the Gemini models are busy right now 😩 This is on Google’s side — try again in a few minutes, or type the grams yourself for now.');
  throw lastErr;
}
function parseGeminiJSON(txt, model, data) {
  if (!txt) {
    const why = data.promptFeedback?.blockReason || data.candidates?.[0]?.finishReason || 'empty reply';
    throw new Error(`Gemini didn’t send an answer (${why}). Try again or add a short description. [${model}]`);
  }
  let t = txt.replace(/```(json)?/g, '').trim();
  try { const v = JSON.parse(t); return Array.isArray(v) ? mergeItems(v) : v; } catch (e) { /* fall through */ }
  const tryParse = (open, close) => {
    const a = t.indexOf(open), b = t.lastIndexOf(close);
    if (a === -1 || b <= a) return null;
    try { const v = JSON.parse(t.slice(a, b + 1)); return Array.isArray(v) ? mergeItems(v) : v; } catch (e) { return null; }
  };
  const ai = t.indexOf('['), oi = t.indexOf('{');
  const got = (ai !== -1 && ai < oi) ? (tryParse('[', ']') || tryParse('{', '}')) : (tryParse('{', '}') || tryParse('[', ']'));
  if (got) return got;
  throw new Error(`Gemini answered but I couldn’t read it: “${t.slice(0, 80)}…” [${model}]`);
}
function mergeItems(arr) {
  // if Gemini lists several foods separately, add them up
  const sum = (k) => arr.reduce((s, x) => s + (Number(x?.[k]) || 0), 0);
  return { food: arr.map((x) => x?.food).filter(Boolean).join(' + '), added_sugar_g: sum('added_sugar_g'), natural_sugar_g: sum('natural_sugar_g'),
    total_sugar_g: sum('total_sugar_g'), confidence: arr[0]?.confidence, assumptions: arr.map((x) => x?.assumptions).filter(Boolean).join(' ') };
}
async function estimateSugar(text, imgDataUrl, force = false) {
  const prompt = `You help someone track their sugar, split into ADDED sugar (sugar, syrups, honey, juice concentrate etc. added during preparation) and NATURAL sugar (naturally present in whole fruit, plain milk, plain vegetables, etc.).
Estimate the grams of ADDED sugar and NATURAL sugar in the food or drink ${imgDataUrl ? 'shown in the photo and/or ' : ''}described below.
Use any quantities given. If no quantity is given, assume what's visible in the photo or one typical serving, and say what you assumed.
For a branded or packaged product or a chain restaurant item, look up its official nutrition facts (the "Includes Xg Added Sugars" line) and use them. If you can read a nutrition label in the photo, trust the label. For homemade or bakery items, estimate from typical recipes. Round to the nearest gram.
If there are several items, add them together into ONE object. Reply ONLY with a single JSON object: {"food":"short name","added_sugar_g":number,"natural_sugar_g":number,"total_sugar_g":number,"confidence":"low"|"medium"|"high","assumptions":"one short friendly sentence"}

Description: ${text || '(none — use the photo)'}`;
  const forced = `STEP 1 — use the Google Search tool NOW to look up the nutrition facts for: "${text}".
Search for this exact item from this exact restaurant, bakery or brand. Good searches: "<item> <place> nutrition facts", "<item> <place> sugar grams", "<place> menu nutrition".
STEP 2 — using what you found, answer the request below.

${prompt}

IMPORTANT — WEB LOOKUP MODE: You MUST use Google Search before answering. Search for this exact item from this exact restaurant, bakery or brand (e.g. their website, menu nutrition page, or a reputable nutrition database). Use the sugar grams you find per item, then scale to the amount eaten (e.g. "half" = divide by 2). Do NOT guess from the photo when you can find real numbers. If the source only lists total sugar, treat all sugar in a dessert or sweetened drink as added. In "assumptions", say where the number came from and the per-item figure you found.`;
  const parts = [{ text: force ? forced : prompt }];
  // in lookup mode, only send the photo if there's no description (the words are what get searched)
  if (imgDataUrl && !(force && text)) parts.push({ inlineData: { mimeType: 'image/jpeg', data: imgDataUrl.split(',')[1] } });
  if (!force) return gemini(parts, { search: state.settings.webSearch });
  let r = await gemini(parts, { search: true, force: true });
  if (!lastSearched) { // Gemini skipped the search — nudge once and try again
    lookupRetried = true;
    const nudge = [{ text: `You answered without searching last time. Before answering, you MUST call Google Search for "${text} nutrition facts sugar".\n\n` + parts[0].text }, ...parts.slice(1)];
    const again = await gemini(nudge, { search: true, force: true }).catch(() => null);
    if (again && lastSearched) r = again;
  }
  return r;
}

async function fetchModels(key) {
  const out = []; let page = '';
  for (let i = 0; i < 10; i++) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000${page ? '&pageToken=' + encodeURIComponent(page) : ''}`, { headers: { 'x-goog-api-key': key } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error?.message || `Couldn’t load models (${res.status})`);
    out.push(...(data.models || []));
    if (!data.nextPageToken) break; page = data.nextPageToken;
  }
  const skip = /embedding|imagen|veo|tts|aqa|image-generation|native-audio|live|lyria|robotics|computer-use/i;
  const ver = (id) => (id.match(/(\d+(?:\.\d+)?)/) || [0, 0])[1] * 1;
  return out
    .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map((m) => ({ id: m.name.replace(/^models\//, ''), label: m.displayName || m.name.replace(/^models\//, '') }))
    .filter((m) => m.id.startsWith('gemini') && !skip.test(m.id))
    .sort((a, b) => ver(b.id) - ver(a.id) || (/flash/.test(b.id) - /flash/.test(a.id)) || a.id.localeCompare(b.id));
}
function backupInfo() {
  if (!state.lastBackup) return '💾 You haven’t made a backup yet.';

}

    <input id="sFlag" type="number" inputmode="numeric" min="0" value="${st.totalFlag}">
    <p class="hint">Set to 0 to turn the heads-up off. Only shows when natural sugar tracking is on.</p>
    <div class="actions"><button class="btn ghost" data-action="closeSheet">Close</button><button class="btn primary" id="save">Save settings</button></div>
    <h3>Backup</h3>
    <p class="hint" style="margin-top:0">Your data lives on this phone only. Export a backup now and then — and ALWAYS before deleting the app from your home screen. On iPhone, tap Export → “Save to Files”.</p>
    <p class="hint" id="bkInfo" style="font-weight:700"></p>
    <div style="display:flex;gap:10px"><button class="btn ghost" id="exp" style="flex:1">⬇️ Export</button><button class="btn ghost" id="imp" style="flex:1">⬆️ Import</button></div>
    <input type="file" id="impIn" accept="application/json,.json" hidden>
    <button class="link danger" id="reset" style="margin-top:16px;color:var(--berry)">Erase everything</button>`, (s) => {
    $('#bkInfo', s).textContent = backupInfo();
    $('#showKey', s).onclick = () => { const k = $('#sKey', s); k.type = k.type === 'password' ? 'text' : 'password'; };
    const selM = $('#sModel', s), hint = $('#modelHint', s), custom = $('#sModelCustom', s);
    const fill = () => {
      const list = st.modelList?.length ? st.modelList : FALLBACK_MODELS.map((id) => ({ id, label: id }));
      const has = list.some((m) => m.id === st.model);
      selM.innerHTML = (has ? '' : `<option value="${esc(st.model)}">${esc(st.model)}</option>`)
        + list.map((m) => `<option value="${esc(m.id)}">${esc(m.label)}${m.label !== m.id ? ` — ${esc(m.id)}` : ''}</option>`).join('')
        + '<option value="__custom">✏️ Type a model name…</option>';
      selM.value = st.model;
      hint.textContent = st.modelList?.length ? `${st.modelList.length} models available on your key. Tap 🔄 to refresh.` : 'Tap 🔄 to load every model your key can use.';
    };
    selM.onchange = () => { custom.classList.toggle('hidden', selM.value !== '__custom'); if (selM.value === '__custom') custom.focus(); };
    const load = async (quiet) => {
      const key = $('#sKey', s).value.trim();
      if (!key) { if (!quiet) hint.textContent = 'Paste your API key first, then tap 🔄.'; return; }
      hint.textContent = 'Loading models…';
      try { st.modelList = await fetchModels(key); save(); fill(); }
      catch (err) { hint.textContent = '😵 ' + err.message; }
    };
    $('#loadModels', s).onclick = () => load(false);
    fill();
    if (st.apiKey && !st.modelList?.length) load(true);
    const apply = () => {
      st.apiKey = $('#sKey', s).value.trim();
      const sel = $('#sModel', s).value;
      st.model = (sel === '__custom' ? $('#sModelCustom', s).value.trim() : sel) || st.model || 'gemini-3.7-flash';
      st.useBackups = $('#sBackup', s).checked;
      st.goal = Math.max(1, Number($('#sGoal', s).value) || 35);
      st.periodGoal = Math.max(1, Number($('#sPGoal', s).value) || 40);
      st.trackNatural = $('#sNat', s).checked;
      st.webSearch = $('#sWeb', s).checked;
      const fv = $('#sFlag', s).value; st.totalFlag = fv === '' ? 90 : Math.max(0, Number(fv) || 0);
    };
    $('#save', s).onclick = () => { apply(); save(); closeSheet(); render(); toast('Settings saved ✔️'); };
    $('#test', s).onclick = async () => {
      apply(); save();
      const out = $('#testOut', s); out.classList.remove('hidden', 'err'); out.textContent = 'Testing…';
      try { const r = await estimateSugar('one 12 oz can of regular Coca-Cola', null); out.textContent = `✅ Your key works! (answered by ${lastModelUsed}${lastModelUsed !== st.model ? ` — ${esc(st.model)} was busy or unavailable, so it used a backup` : ''}) A can of Coke ≈ ${r.added_sugar_g}g added sugar.`; }
      catch (err) { out.classList.add('err'); out.textContent = '😵 ' + err.message; }
    };
    $('#exp', s).onclick = async () => {
      const name = `crash-buster-backup-${todayKey()}.json`;
      const json = JSON.stringify({ ...state, settings: { ...state.settings, apiKey: '' }, exportedAt: Date.now() }, null, 2);
      const file = new File([json], name, { type: 'application/json' });
      const done = () => { state.lastBackup = Date.now(); save(); $('#bkInfo', s).textContent = backupInfo(); toast('Backup saved 💾'); };
      // iPhone: the share sheet lets you "Save to Files" (downloads are flaky in home-screen apps)
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Crash Buster backup' }); done(); return; }
        catch (err) { if (err.name === 'AbortError') return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000); done();
    };
    $('#imp', s).onclick = () => $('#impIn', s).click();
    $('#impIn', s).onchange = async (ev) => {
      try {
        const data = JSON.parse(await ev.target.files[0].text());
        if (!Array.isArray(data.entries)) throw new Error('That doesn’t look like a Crash Buster backup');
        const n = (k) => (data[k] || []).length;
        const when = data.exportedAt ? ` from ${fmtDateTime(data.exportedAt)}` : '';
        if (!confirm(`Restore this backup${when}?\n\n${n('entries')} logs · ${n('whys')} reasons · ${n('goals')} goals · ${n('foods')} saved foods\n\nThis replaces what’s on this device right now.`)) { ev.target.value = ''; return; }
        const key = state.settings.apiKey;
        state = Object.assign(DEFAULT_STATE(), data); state.settings = Object.assign(DEFAULT_STATE().settings, data.settings || {});
        if (!state.settings.apiKey) state.settings.apiKey = key;
        await save(); closeSheet(); render(); toast(state.settings.apiKey ? 'Backup restored ✔️' : 'Backup restored ✔️ Paste your Gemini key in ⚙️ again');
      } catch (err) { toast('😵 ' + err.message); }
    };
    $('#reset', s).onclick = async () => {
      if (!confirm('Erase ALL entries, reasons, goals and settings? This can’t be undone.')) return;
      state = DEFAULT_STATE(); await save(); closeSheet(); render(); toast('Fresh start ✨');
    };
  });
}

/* ---------- misc actions ---------- */
function delEntry(id) {
  if (!confirm('Delete this entry?')) return;
  state.entries = state.entries.filter((x) => x.id !== id); save(); closeSheet(); render(); toast('Deleted');
}
function togglePeriod() {
  const k = ui.day;
  if (state.periodDays[k]) { let d = k; while (state.periodDays[d]) { delete state.periodDays[d]; d = addDays(d, 1); } toast(`Back to ${state.settings.goal}g`); }
  else { for (let i = 0; i < 7; i++) state.periodDays[addDays(k, i)] = true; toast(`🌸 ${state.settings.periodGoal}g goal for the next 7 days. Be gentle with you.`); }
  save(); render();
}

const ACTIONS = {
  tab: (el) => { ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  openSettings, closeSheet,
  dayPrev: () => { ui.day = addDays(ui.day, -1); ui.followToday = false; render(); },
  dayNext: () => { if (ui.day < todayKey()) ui.day = addDays(ui.day, 1); ui.followToday = ui.day === todayKey(); render(); },
  dayToday: () => { ui.day = todayKey(); ui.followToday = true; render(); },
  togglePeriod, openCalendar,
  newProgress: () => openProgressSheet(), editProgress: (el) => openProgressSheet((state.progress || []).find((x) => x.id === el.dataset.id)),
  newFood: () => openFoodSheet(), newMeal: (el) => openFoodSheet(null, { ts: mealTime(el.dataset.m) }), newCraving: () => openCravingSheet(), newWin: () => openWinSheet(), newJournal: () => openJournalSheet(),
  editEntry: (el) => {
    const e = state.entries.find((x) => x.id === el.dataset.id); if (!e) return;
    ({ food: openFoodSheet, craving: openCravingSheet, win: openWinSheet, journal: openJournalSheet })[e.type](e);
  },
  outcome: (el) => setOutcome(el.dataset.id, el.dataset.v),
  pickMove: (el) => { const e = state.entries.find((x) => x.id === el.dataset.id); if (e) cravingStep2(e); },
  pinWhy: (el) => pinWhy(el.dataset.id),
  jFilter: (el) => { ui.jFilter = el.dataset.v; render(); },
  kit: (el) => { ui.kit = el.dataset.v; render(); },
  newWhy: () => openWhySheet(), editWhy: (el) => openWhySheet(state.whys.find((x) => x.id === el.dataset.id)),
  newMove: () => openMoveSheet(), editMove: (el) => openMoveSheet(moveById(el.dataset.id)),
  newGoal: () => openGoalSheet(), editGoal: (el) => openGoalSheet(state.goals.find((x) => x.id === el.dataset.id))
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  ev.preventDefault(); ev.stopPropagation(); fn(el, ev);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  markOpen();
  if (ui.followToday && ui.day !== todayKey()) ui.day = todayKey();
  render();
});

/* ---------- boot ---------- */
(async function boot() {
  try {
    const saved = await idbGet('state');
    if (saved) {
      state = Object.assign(DEFAULT_STATE(), saved); state.settings = Object.assign(DEFAULT_STATE().settings, saved.settings || {});
      if (state.settings.model === 'gemini-3.5-flash') { state.settings.model = 'gemini-3.7-flash'; save(); } // upgrade old default
    }
    else { seed(); await save(); }
  } catch (e) { seed(); toast('⚠️ Storage unavailable — data won’t persist'); }
  if (!state.progressSeeded) {
    const t = new Date(2026, 10, 8, 21, 33).getTime();
    state.progress = (state.progress || []).concat([
      { id: uid(), ts: t, area: '🍽️ Hunger', then: 'Eating 4 meals a day', now: 'Eating 3 meals a day — I’m so much less hungry since cutting back on sugar' },
      { id: uid(), ts: t, area: '⚡ Energy', then: 'Couldn’t get up in the morning', now: 'Waking up at the ass crack of dawn full of energy, before any caffeine' },
      { id: uid(), ts: t, area: '👀 Others noticed', then: '', now: 'My husband noticed a huge difference in me' }
    ]);
    state.progressSeeded = true; save();
  }
  markOpen();
  render();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
</body>
